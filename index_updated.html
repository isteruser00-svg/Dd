<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seni Seviyorum ❤️</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#heart{position:relative;width:100vw;height:100vh}
.word{position:absolute;font-size:18px;font-weight:bold;white-space:nowrap;opacity:0;transform:translate(-50%,-50%);animation:appear .7s forwards}
#hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:14px;pointer-events:none;transition:opacity 1s}
@keyframes appear{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="heart"></div>
<div id="hint">Ekrana dokun ❤️</div>
<audio id="music" loop preload="auto">
<source src="seni seviyorum (1).mp3" type="audio/mpeg">
</audio>
<script>
const heart=document.getElementById("heart");
const music=document.getElementById("music");
const hint=document.getElementById("hint");
const words=["i love you","I Love You","I LOVE YOU"];
const colors=["#ff0000","#dc143c","#b22222","#ff4500"];

function heartPoint(t){
 const x=16*Math.pow(Math.sin(t),3);
 const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
 return [x,y];
}
function addWord(x,y,delay){
 const el=document.createElement("div");
 el.className="word";
 el.textContent=words[Math.floor(Math.random()*words.length)];
 el.style.color=colors[Math.floor(Math.random()*colors.length)];
 el.style.left=x+"px";
 el.style.top=y+"px";
 el.style.animationDelay=delay+"ms";
 heart.appendChild(el);
}
function createHeart(){
 heart.innerHTML="";
 const w=innerWidth,h=innerHeight,scale=Math.min(w,h)/40,cx=w/2,cy=h/2;
 for(let i=0;i<95;i++){
  const t=i/95*Math.PI*2,[x,y]=heartPoint(t);
  addWord(cx+x*scale,cy+y*scale,i*18);
 }
 for(let i=0;i<65;i++){
  const t=Math.random()*Math.PI*2,r=.22+Math.random()*.56,[x,y]=heartPoint(t);
  addWord(cx+x*scale*r,cy+y*scale*r,1800+i*16);
 }
}
let started=false;
function startMusic(){
 if(started)return;
 music.play().then(()=>{
  started=true;
  hint.style.opacity="0";
 }).catch(()=>{});
}
document.addEventListener("pointerdown",startMusic);
document.addEventListener("click",startMusic);
createHeart();
addEventListener("resize",createHeart);
</script>
</body>
</html>
