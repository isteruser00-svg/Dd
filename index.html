<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

body {
    touch-action: manipulation;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

#hint {
    position: fixed;
    bottom: 25px;
    left: 0;
    width: 100%;
    text-align: center;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    opacity: 0.8;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="hint">Müziği başlatmak için ekrana dokun ❤️</div>

<audio id="music" preload="auto" loop>
    <source src="seni%20seviyorum.mp3" type="audio/mpeg">
</audio>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const music = document.getElementById("music");
const hint = document.getElementById("hint");

let W, H;
let particles = [];

const WORDS = [
    "i love you",
    "I Love You",
    "I LOVE YOU"
];

const COLORS = [
    [255, 0, 0],
    [220, 20, 60],
    [178, 34, 34],
    [255, 69, 0]
];

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createHeart();
}

window.addEventListener("resize", resize);


/* =========================
   KALP FORMÜLÜ
========================= */

function heart(t) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return [x, -y];
}


/* =========================
   KALBİ OLUŞTUR
========================= */

function createHeart() {

    particles = [];

    /*
       Pygame'deki 13 ölçeğini
       biraz büyüttük.
    */

    const scale = Math.min(W, H) / 42;

    /* KALP KENARI */

    for (let i = 0; i < 95; i++) {

        const t = (i / 95) * Math.PI * 2;

        const [x, y] = heart(t);

        particles.push({

            x: x * scale + W / 2,
            y: y * scale + H / 2,

            word:
                WORDS[Math.floor(Math.random() * WORDS.length)],

            color:
                COLORS[Math.floor(Math.random() * COLORS.length)],

            alpha: 0,

            delay: i * 5

        });
    }


    /* KALBİN İÇİ */

    for (let i = 0; i < 65; i++) {

        const t =
            Math.random() * Math.PI * 2;

        const r =
            0.22 + Math.random() * 0.56;

        const [x, y] = heart(t);

        particles.push({

            x: x * r * scale + W / 2,
            y: y * r * scale + H / 2,

            word:
                WORDS[Math.floor(Math.random() * WORDS.length)],

            color:
                COLORS[Math.floor(Math.random() * COLORS.length)],

            alpha: 0,

            delay: 500 + i * 7

        });
    }
}


/* =========================
   MÜZİĞİ BAŞLAT
========================= */

async function startMusic() {

    try {

        music.currentTime = 0;

        await music.play();

        hint.style.display = "none";

    } catch (error) {

        console.log("Müzik başlatılamadı:", error);

        hint.innerHTML =
            "Müziği başlatmak için tekrar dokun ❤️";
    }
}


/*
   TELEFONDA İLK DOKUNUŞ
*/

document.addEventListener(
    "pointerdown",
    startMusic,
    { once: true }
);


/* =========================
   ANİMASYON
========================= */

let frame = 0;

function draw() {

    frame++;

    ctx.fillStyle = "black";

    ctx.fillRect(0, 0, W, H);


    for (const p of particles) {

        if (
            frame > p.delay &&
            p.alpha < 255
        ) {

            p.alpha += 9;

            if (p.alpha > 255)
                p.alpha = 255;
        }


        if (p.alpha > 0) {

            ctx.save();

            ctx.globalAlpha =
                p.alpha / 255;

            ctx.font =
                "bold 22px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillStyle =
                `rgb(${p.color[0]},${p.color[1]},${p.color[2]})`;

            ctx.shadowColor =
                ctx.fillStyle;

            ctx.shadowBlur = 5;

            ctx.fillText(
                p.word,
                p.x,
                p.y
            );

            ctx.restore();
        }
    }


    requestAnimationFrame(draw);
}


/* BAŞLAT */

resize();
draw();

</script>

</body>
</html>
