<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>I Love You ❤️</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: black;
}

#hint {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #777;
    font: 16px Arial, sans-serif;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="canvas" width="1080" height="1920"></canvas>

<div id="hint">
    Müziği başlatmak için ekrana dokun ❤️
</div>

<audio id="music" preload="auto" loop>
    <source
        src="https://raw.githubusercontent.com/isteruser00-svg/Dd/main/love_you%20%283%29.mp3"
        type="audio/mpeg">
</audio>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const music = document.getElementById("music");
const hint = document.getElementById("hint");

const WIDTH = 1080;
const HEIGHT = 1920;

const WORDS = [
    "i love you",
    "I Love You",
    "I LOVE YOU"
];

const COLORS = [
    "rgb(255,0,0)",
    "rgb(220,20,60)",
    "rgb(178,34,34)",
    "rgb(255,69,0)"
];

let particles = [];
let frame = 0;


/* PYGAME'DEKİ KALP DENKLEMİ */

function heart(t) {

    const x =
        16 * Math.sin(t) ** 3;

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return [x, -y];
}


/* PYGAME'DEKİ PARÇACIKLAR */

for (let i = 0; i < 95; i++) {

    const t =
        (i / 95) * 6.28;

    const [x, y] = heart(t);

    particles.push({

        x: x * 13 + WIDTH / 2,
        y: y * 13 + HEIGHT / 2,

        word:
            WORDS[
                Math.floor(
                    Math.random() * WORDS.length
                )
            ],

        color:
            COLORS[
                Math.floor(
                    Math.random() * COLORS.length
                )
            ],

        alpha: 0,
        delay: i * 1.8
    });
}


for (let i = 0; i < 65; i++) {

    const t =
        Math.random() * 6.28;

    const r =
        0.22 + Math.random() * 0.56;

    const [x, y] = heart(t);

    particles.push({

        x:
            x * r * 13
            + WIDTH / 2,

        y:
            y * r * 13
            + HEIGHT / 2,

        word:
            WORDS[
                Math.floor(
                    Math.random() * WORDS.length
                )
            ],

        color:
            COLORS[
                Math.floor(
                    Math.random() * COLORS.length
                )
            ],

        alpha: 0,
        delay: 180 + i * 1.6
    });
}


/* PYGAME GÖRÜNÜMÜ */

ctx.font = "bold 22px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";


function draw() {

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    for (const p of particles) {

        if (
            frame > p.delay &&
            p.alpha < 255
        ) {

            p.alpha =
                Math.min(
                    255,
                    p.alpha + 9
                );
        }

        if (p.alpha > 0) {

            ctx.globalAlpha =
                p.alpha / 255;

            ctx.fillStyle =
                p.color;

            ctx.fillText(
                p.word,
                p.x,
                p.y
            );
        }
    }

    ctx.globalAlpha = 1;

    frame++;

    requestAnimationFrame(draw);
}


/* MÜZİK */

let musicStarted = false;

async function startMusic() {

    if (musicStarted) {
        return;
    }

    try {

        await music.play();

        musicStarted = true;

        hint.style.display = "none";

    } catch (error) {

        console.log(
            "Müzik başlatılamadı:",
            error
        );

        hint.innerText =
            "Tekrar ekrana dokun ❤️";
    }
}


/* TELEFONA DOKUNUNCA */

document.addEventListener(
    "pointerdown",
    startMusic,
    { once: true }
);

document.addEventListener(
    "touchstart",
    startMusic,
    { once: true }
);


/* BAŞLAT */

draw();

</script>

</body>
</html>
