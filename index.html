<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seni Seviyorum ❤️</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:Arial,sans-serif;touch-action:manipulation}
canvas{display:block;width:100%;height:100%}
#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);color:#bfe8ff;font-size:16px;text-align:center;text-shadow:0 0 10px #078cff;pointer-events:none}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hint">Müziği başlatmak için ekrana dokun ❤️</div>
<audio id="music" src="seni seviyorum.mp3" loop></audio>
<script>
const c=document.getElementById("canvas"),x=c.getContext("2d"),m=document.getElementById("music"),h=document.getElementById("hint");
let W,H,D,ps=[];
function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}
addEventListener("resize",size);size();
function heart(t){return[16*Math.sin(t)**3,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]}
for(let i=0;i<1100;i++){let t=Math.random()*Math.PI*2,p=heart(t),s=.5+Math.random()*.9;ps.push({x:p[0]*s,y:p[1]*s,r:.7+Math.random()*2.4,q:Math.random()*6.28})}
function draw(n){let t=n/1000,s=Math.min(W,H)/42;x.fillStyle="rgba(0,0,0,.2)";x.fillRect(0,0,W,H);
for(const p of ps){let z=1+Math.sin(t*2+p.q)*.04;x.fillStyle="rgba(40,170,255,"+(.45+.4*Math.sin(t*1.7+p.q))+")";x.shadowBlur=8;x.shadowColor="#159cff";x.beginPath();x.arc(W/2+p.x*s*z,H/2+p.y*s*z,p.r,0,Math.PI*2);x.fill()}
x.shadowBlur=0;x.textAlign="center";x.textBaseline="middle";x.font="bold "+Math.max(30,Math.min(58,W*.075))+"px Arial";x.fillStyle="#fff";x.shadowBlur=25;x.shadowColor="#159cff";x.fillText("Love You",W/2,H/2);x.shadowBlur=0;requestAnimationFrame(draw)}
requestAnimationFrame(draw);
async function play(){try{await m.play();h.style.display="none"}catch(e){h.textContent="Tekrar dokun ❤️"}}
addEventListener("pointerdown",play);addEventListener("touchstart",play,{passive:true});
</script>
</body>
</html>
