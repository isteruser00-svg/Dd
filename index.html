<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>I Love You ❤️</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#hint {
    position: fixed;
    bottom: 25px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #777;
    font: 16px Arial, sans-serif;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="hint">Müziği başlatmak için ekrana dokun ❤️</div>

<audio id="music" preload="auto" loop>
    <source src="love_you%20%283%29.mp3" type="audio/mpeg">
</audio>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const music = document.getElementById("music");
const hint = document.getElementById("hint");

let W = 0;
let H = 0;
let frame = 0;
let particles = [];
let musicStarted = false;


/* PYGAME'DEKİ AYNI YAZILAR */

const WORDS = [
    "i love you",
    "I Love You",
    "I LOVE YOU"
];


/* PYGAME'DEKİ AYNI RENKLER */

const COLORS = [
    "#ff0000",
    "#dc143c",
    "#b22222",
    "#ff4500"
];


/* EKRAN */

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


/* PYGAME'DEKİ AYNI KALP DENKLEMİ */

function heart(t) {

    const x =
        16 * Math.sin(t) ** 3;

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return [x, -y];
}


/* PARÇACIKLAR */

function createParticles() {

    particles = [];

    /*
       Pygame'de 13'tü.
       15 = biraz daha büyük.
    */

    const scale =
        Math.min(W / 1080, H / 1920) * 15;


    /* DIŞ KALP */

    for (let i = 0; i < 95; i++) {

        const t =
            (i / 95) * Math.PI * 2;

        const [x, y] = heart(t);

        particles.push({

            x: x * scale + W / 2,
            y: y * scale + H / 2,

            word:
                WORDS[
                    Math.floor(
                        Math.random() * WORDS.length
                    )
                ],

            color:
                COLORS[
                    Math.floor(
                        Math.random() * COLORS.length
                    )
                ],

            alpha: 0,

            delay: i * 1.8
        });
    }


    /* İÇ KALP */

    for (let i = 0; i < 65; i++) {

        const t =
            Math.random() * Math.PI * 2;

        const r =
            Math.random() * (0.78 - 0.22) + 0.22;

        const [x, y] = heart(t);

        particles.push({

            x: x * r * scale + W / 2,
            y: y * r * scale + H / 2,

            word:
                WORDS[
                    Math.floor(
                        Math.random() * WORDS.length
                    )
                ],

            color:
                COLORS[
                    Math.floor(
                        Math.random() * COLORS.length
                    )
                ],

            alpha: 0,

            delay: 180 + i * 1.6
        });
    }
}


/* ÇİZİM */

function draw() {

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.font =
        "bold 22px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (const p of particles) {

        if (
            frame > p.delay &&
            p.alpha < 255
        ) {

            p.alpha =
                Math.min(
                    255,
                    p.alpha + 9
                );
        }

        if (p.alpha > 0) {

            ctx.globalAlpha =
                p.alpha / 255;

            ctx.fillStyle =
                p.color;

            ctx.fillText(
                p.word,
                p.x,
                p.y
            );
        }
    }

    ctx.globalAlpha = 1;

    frame++;

    requestAnimationFrame(draw);
}


/* MÜZİK */

async function startMusic() {

    if (musicStarted) {
        return;
    }

    try {

        music.volume = 1;

        await music.play();

        musicStarted = true;

        hint.style.display = "none";

    } catch (error) {

        console.log(
            "Müzik hatası:",
            error
        );

        hint.innerText =
            "Tekrar ekrana dokun ❤️";
    }
}


/* TELEFONA DOKUNUNCA ÇAL */

document.addEventListener(
    "pointerdown",
    startMusic,
    {
        once: true,
        passive: true
    }
);

document.addEventListener(
    "touchstart",
    startMusic,
    {
        once: true,
        passive: true
    }
);


/* EKRAN BOYUTU DEĞİŞİRSE */

window.addEventListener(
    "resize",
    function () {

        resize();
        createParticles();

    }
);


/* BAŞLAT */

resize();
createParticles();
draw();

</script>

</body>
</html>
