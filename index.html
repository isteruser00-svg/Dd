<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
#hint{position:fixed;bottom:28px;left:0;right:0;text-align:center;color:rgba(255,255,255,.65);font:16px Arial;pointer-events:none}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hint">Müziği başlatmak için ekrana dokun</div>
<audio id="music" src="music.mp3" loop preload="auto"></audio>
<script>
const c=document.getElementById("canvas"),x=c.getContext("2d"),m=document.getElementById("music"),h=document.getElementById("hint");
let W,H,S,f=0,started=false,fillStart=0,P=[];
const words=["love you","Love You","LOVE YOU"];
const colors=[[70,130,180],[30,144,255],[0,191,255],[100,149,237],[65,105,225]];

function resize(){
 W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);
 c.width=W*d;c.height=H*d;c.style.width=W+"px";c.style.height=H+"px";
 x.setTransform(d,0,0,d,0,0);S=Math.min(W/2000,H/1200)*20;
}
function heart(t){
 return [16*Math.sin(t)**3,
 -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))];
}
function add(px,py,o,k){
 P.push({x:px*S+W/2,y:py*S+H/2,order:o,kind:k,
 word:words[Math.floor(Math.random()*words.length)],
 color:colors[Math.floor(Math.random()*colors.length)],
 alpha:0,phase:Math.random()*Math.PI*2,size:.85+Math.random()*.3,delay:0});
}
function build(){
 P=[];
 const placed=[];
 for(let i=0;i<160;i++){
  const [bx,by]=heart(i/160*Math.PI*2),sx=bx,sy=by;
  const q=[sx*S+W/2,sy*S+H/2];
  if(placed.some(a=>Math.hypot(q[0]-a[0],q[1]-a[1])<S*1.5))continue;
  placed.push(q);add(sx,sy,i,"outline");
 }
 const span=Math.max(...P.map(p=>p.order),0),step=1.6;
 fillStart=Math.floor(span*step)+30;
 P.forEach(p=>p.delay=Math.floor(p.order*step));
 const placed2=[];let tries=0;
 while(placed2.length<130&&tries++<10400){
  const t=Math.random()*Math.PI*2,r=Math.random()*.86;
  const [bx,by]=heart(t),q=[bx*r*S+W/2,by*r*S+H/2];
  if(placed2.some(a=>Math.hypot(q[0]-a[0],q[1]-a[1])<S*2.3))continue;
  placed2.push(q);
  const p={x:q[0],y:q[1],order:Math.floor(Math.random()*321),kind:"fill",
  word:words[Math.floor(Math.random()*words.length)],
  color:colors[Math.floor(Math.random()*colors.length)],alpha:0,
  phase:Math.random()*Math.PI*2,size:.85+Math.random()*.3,delay:0};
  p.delay=fillStart+p.order;P.push(p);
 }
}
function rgba(a,z){return`rgba(${a[0]},${a[1]},${a[2]},${z})`}
function draw(p){
 if(p.alpha<=0)return;
 const flick=p.alpha>=255?.75+.25*Math.sin(f*.04+p.phase):1;
 const a=p.alpha/255*flick;if(a<=0)return;
 x.font=`bold ${(p.kind==="outline"?20:17)*p.size}px Arial`;
 x.textAlign="center";x.textBaseline="middle";
 x.shadowBlur=10;x.shadowColor=rgba(p.color,a*.8);x.fillStyle=rgba(p.color,a);
 x.fillText(p.word,p.x,p.y);x.shadowBlur=0;
}
function loop(){
 x.clearRect(0,0,W,H);f++;
 P.forEach(p=>{if(f>p.delay&&p.alpha<255)p.alpha=Math.min(255,p.alpha+14+Math.floor(Math.random()*5));draw(p)});
 if(f>fillStart+200){
  const a=1-Math.exp(-Math.min(1,(f-fillStart-200)/60)*8);
  const pulse=1+.025*Math.sin(f*.05);
  x.font=`bold ${Math.max(20,54*Math.min(W/2000,H/1200)*pulse)}px Georgia`;
  x.textAlign="center";x.textBaseline="middle";x.shadowBlur=18;
  x.shadowColor=`rgba(255,250,245,${a*.4})`;x.fillStyle=`rgba(255,250,245,${a})`;
  x.fillText("Love You",W/2,H/2);x.shadowBlur=0;
 }
 requestAnimationFrame(loop);
}
function musicStart(){
 if(started)return;
 m.play().then(()=>{started=true;h.style.opacity=0}).catch(()=>{h.textContent="Müziği başlatmak için tekrar dokun"});
}
addEventListener("click",musicStart);
addEventListener("touchstart",musicStart,{passive:true});
addEventListener("resize",()=>{resize();build()});
resize();build();loop();
</script>
</body>
</html>
