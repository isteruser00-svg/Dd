<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seni Seviyorum ❤️</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    touch-action: manipulation;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#hint {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 17px;
    text-align: center;
    text-shadow: 0 0 15px #008cff;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="hint">
    Müziği başlatmak için ekrana dokun ❤️
</div>

<audio id="music" src="seni seviyorum.mp3" loop></audio>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const music = document.getElementById("music");
const hint = document.getElementById("hint");

let W = window.innerWidth;
let H = window.innerHeight;

let particles = [];

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

window.addEventListener("resize", resize);

resize();


/* KALP ŞEKLİ */

function heart(t) {

    return {
        x:
        16 * Math.sin(t) * Math.sin(t) * Math.sin(t),

        y:
        -(
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t)
        )
    };
}


/* KALP PARÇACIKLARI */

for (let i = 0; i < 1800; i++) {

    let t = Math.random() * Math.PI * 2;

    let p = heart(t);

    let scale = 1 + Math.random() * 0.8;

    particles.push({

        x: p.x * scale,

        y: p.y * scale,

        size: 1 + Math.random() * 3,

        phase: Math.random() * Math.PI * 2
    });
}


/* ANİMASYON */

function animate(time) {

    time = time / 1000;

    ctx.fillStyle = "rgba(0,0,0,0.20)";
    ctx.fillRect(0, 0, W, H);

    /*
       KALBİ BÜYÜTTÜK
    */

    let scale = Math.min(W, H) / 30;

    let centerX = W / 2;
    let centerY = H / 2;


    /* PARÇACIKLAR */

    for (let p of particles) {

        let pulse =
            1 + Math.sin(time * 2 + p.phase) * 0.04;

        let x =
            centerX +
            p.x * scale * pulse;

        let y =
            centerY +
            p.y * scale * pulse;


        let alpha =
            0.5 +
            0.4 *
            Math.sin(time * 2 + p.phase);


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(30,160,255,${alpha})`;

        ctx.shadowBlur = 10;

        ctx.shadowColor = "#008cff";

        ctx.fill();
    }


    ctx.shadowBlur = 0;


    /* ORTADAKİ YAZI */

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font =
        "bold " +
        Math.max(32, Math.min(65, W * 0.09)) +
        "px Arial";

    ctx.fillStyle = "white";

    ctx.shadowBlur = 25;

    ctx.shadowColor = "#008cff";

    ctx.fillText(
        "Love You",
        centerX,
        centerY
    );

    ctx.shadowBlur = 0;


    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);


/* MÜZİĞİ DOKUNUNCA BAŞLAT */

async function startMusic() {

    try {

        await music.play();

        hint.style.display = "none";

    } catch (error) {

        hint.innerText =
            "Tekrar ekrana dokun ❤️";
    }
}


/*
   Telefonda dokunma
*/

document.addEventListener(
    "pointerdown",
    startMusic
);

document.addEventListener(
    "touchstart",
    startMusic,
    { passive: true }
);

</script>

</body>
</html>
