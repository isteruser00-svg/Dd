<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seni Seviyorum ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: Arial, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #start {
    position: fixed;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 10; border: 0; border-radius: 999px;
    padding: 16px 26px; font-size: 18px; font-weight: bold;
    color: white; background: rgba(220,20,60,.9); cursor: pointer;
    box-shadow: 0 0 30px rgba(255,0,60,.35);
  }
  #hint {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 5; color: rgba(255,255,255,.7); font-size: 13px;
    text-align: center; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- Bu MP3 dosyasını index.html ile aynı GitHub Pages klasörüne koy. -->
<audio id="music" loop preload="auto">
  <source src="seni seviyorum (1).mp3" type="audio/mpeg">
</audio>

<button id="start">❤️ Başlat</button>
<div id="hint">Müziği başlatmak için dokun</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const start = document.getElementById('start');
const hint = document.getElementById('hint');
const music = document.getElementById('music');

let W, H, particles = [], frame = 0, running = false;
const words = ['i love you', 'I Love You', 'I LOVE YOU'];
const colors = ['rgb(255,0,0)','rgb(220,20,60)','rgb(178,34,34)','rgb(255,69,0)'];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);
resize();

function heart(t) {
  const x = 16 * Math.sin(t) ** 3;
  const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return [x, -y];
}

function makeParticles() {
  particles = [];
  const scale = Math.min(W, H) / 70;

  // Kalp kenarı
  for (let i = 0; i < 95; i++) {
    const t = (i / 95) * Math.PI * 2;
    const [x,y] = heart(t);
    particles.push({
      x: x*scale + W/2, y: y*scale + H/2,
      word: words[Math.floor(Math.random()*words.length)],
      color: colors[Math.floor(Math.random()*colors.length)],
      alpha: 0, delay: i*1.8
    });
  }

  // İç kısım
  for (let i = 0; i < 65; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = 0.22 + Math.random()*0.56;
    const [x,y] = heart(t);
    particles.push({
      x: x*r*scale + W/2, y: y*r*scale + H/2,
      word: words[Math.floor(Math.random()*words.length)],
      color: colors[Math.floor(Math.random()*colors.length)],
      alpha: 0, delay: 180 + i*1.6
    });
  }
}

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);
  frame++;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 16px Arial';

  for (const p of particles) {
    if (frame > p.delay && p.alpha < 255) p.alpha = Math.min(255, p.alpha + 9);
    if (p.alpha > 0) {
      ctx.globalAlpha = p.alpha / 255;
      ctx.fillStyle = p.color;
      ctx.fillText(p.word, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

makeParticles();
draw();

start.addEventListener('click', async () => {
  try {
    await music.play();
  } catch (e) {
    console.log(e);
  }
  start.style.display = 'none';
  hint.textContent = '❤️ Seni seviyorum ❤️';
});
</script>
</body>
</html>
